<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Привычки — вход</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✦</text></svg>">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="auth">
      <div class="auth-head">
        <div class="brand-mark">✦</div>
        <h1>Привычки</h1>
        <p class="muted">Маленькие шаги каждый день</p>
      </div>

      <div class="card">
        <div class="segmented" role="tablist">
          <button type="button" class="selected" data-testid="tab-login" data-mode="login" role="tab">Вход</button>
          <button type="button" data-testid="tab-register" data-mode="register" role="tab">Регистрация</button>
        </div>

        <form id="auth-form" data-testid="auth-form" novalidate>
          <div class="field">
            <label class="label" for="username">Логин</label>
            <input class="input" id="username" name="username" autocomplete="username"
                   data-testid="input-username" placeholder="например, gleb_k">
          </div>
          <div class="field">
            <label class="label" for="password">Пароль <small id="password-hint" class="hidden">— от 6 до 64 символов</small></label>
            <input class="input" id="password" name="password" type="password" autocomplete="current-password"
                   data-testid="input-password">
          </div>
          <div class="form-error" data-testid="auth-error" role="alert"></div>
          <button class="btn btn-primary btn-block" type="submit" data-testid="btn-submit">Войти</button>
        </form>
      </div>

      <p class="hint hidden" data-testid="demo-hint">Тестовый режим · demo / demo123 · admin / admin123</p>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
